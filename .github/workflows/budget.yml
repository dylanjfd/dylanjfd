name: Mon Budget (PWA)

on:
  push:
    paths: ['budget/**', '.github/workflows/budget.yml']
  pull_request:
    paths: ['budget/**', '.github/workflows/budget.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: budget/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Adresse GitHub Pages du dépôt : https://<utilisateur>.github.io/<dépôt>/
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: budget/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
